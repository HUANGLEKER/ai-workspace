name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Go 后端（vet + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-workspace-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ai-workspace-backend/go.mod
          cache-dependency-path: ai-workspace-backend/go.sum
      - name: gofmt 检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "未格式化文件:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  web:
    name: 前端（tsc + vitest + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-workspace-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ai-workspace-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vite build

  ai-service:
    name: AI 服务（依赖锁定 + 导入冒烟）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - run: uv sync --frozen
      - name: 应用导入冒烟（路由装配 + 配置加载）
        run: uv run python -c "import main; print('routes:', len(main.app.routes))"
