server:
  port: 8080
  mode: debug  # debug | release

database:
  dsn: "root:123456@tcp(localhost:3306)/ai_workspace?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600  # seconds

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "ai-workspace-jwt-secret-change-in-production"
  expire: 86400  # seconds (24h)

fastapi:
  base_url: "http://localhost:8001"
  timeout: 120  # seconds

minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "ai-workspace"
  use_ssl: false

log:
  level: "info"    # debug | info | warn | error
  filename: "logs/app.log"
  max_size: 100    # MB
  max_backups: 7
  max_age: 30      # days
  compress: true

ratelimit:
  llm_per_minute: 20
  llm_per_minute_admin: 60  # 每用户每分钟 LLM 端点请求上限；<=0 关闭

upload:
  max_size_mb: 50  # 单文件大小上限 MB；<=0 不限制
  file_exts: [".jpg", ".jpeg", ".png", ".gif", ".webp", ".pdf", ".txt", ".md", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip", ".csv", ".json"]
  doc_exts: [".pdf", ".txt", ".md", ".doc", ".docx"]  # 知识库文档（嵌入管道支持的类型）

security:
  secret_key: ""  # 敏感字段加密密钥；留空回退 jwt.secret，生产务必单独配置

cors:
  allowed_origins: []  # 留空或含 "*" 放通所有来源；多用户部署改为显式来源如 ["https://app.example.com"]

tracing:
  service_name: "ai-workspace-backend"
  endpoint: ""  # OTLP/HTTP 采集端点（host:port，如 localhost:4318）；留空则不启用链路追踪
