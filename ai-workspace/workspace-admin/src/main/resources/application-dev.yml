# 开发环境（dev profile）配置：本地 MySQL + Redis
# 由 application.yml 通过 spring.profiles.active=dev 激活
spring:
  datasource:
    # JDBC 连接串：强制 utf8 编码、东八区时区；allowPublicKeyRetrieval+useSSL=false 适配本地 MySQL 8 免 SSL 连接
    url: jdbc:mysql://localhost:3306/ai_workspace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456                       # 本地默认密码，生产环境须用环境变量/密钥管理替换
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池调优
    hikari:
      pool-name: AiWorkspaceHikari
      maximum-pool-size: 20                 # 最大连接数，匹配嵌入/流式线程池的并发上限
      minimum-idle: 5                       # 最小空闲连接，避免冷启动时频繁建连
      connection-timeout: 30000             # 获取连接超时（毫秒）
      idle-timeout: 600000                  # 空闲连接回收时间（10 分钟）
      max-lifetime: 1700000                 # 连接最大存活时间，须略小于 MySQL wait_timeout，防止使用到被服务端关闭的连接
      keepalive-time: 120000                # 空闲连接保活探测间隔（2 分钟）
      connection-test-query: SELECT 1       # 连接有效性探测语句

  # Redis 配置（FastAPI 用 DB 1，Spring Boot 用 DB 0）—— 必须位于 spring.data.redis 之下方能被 Spring Boot 3 识别
  data:
    redis:
      host: localhost
      port: 6379
      database: 0                           # Spring Boot 使用 DB 0
      timeout: 3000ms                       # 命令读写超时

logging:
  level:
    # 开发期开启 Spring Security 调试日志，便于排查认证/鉴权链路
    org.springframework.security: DEBUG
