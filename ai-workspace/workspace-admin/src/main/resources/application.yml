server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20000

spring:
  profiles:
    active: dev
  application:
    name: ai-workspace
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Route SQL logging through SLF4J (was StdOutImpl, which printed every statement
    # to stdout — noisy and slow). Control verbosity via the logging level below.
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # Base64 encoded secret, minimum 256 bits for HS256 — replace in production
  secret: YUlXb3Jrc3BhY2VTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24xMjM0NTY=
  expiration: 86400000  # 24h

fastapi:
  base-url: http://localhost:8001
  connect-timeout: 10000
  read-timeout: 180000
  stream-timeout: 180000

logging:
  level:
    # Set to DEBUG to see SQL again during local debugging.
    com.aiworkspace: INFO

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: ai-workspace
  secure: false
